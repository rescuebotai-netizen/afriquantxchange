<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Black & White Minimalist Financial Chart - Transparent Background -->
  <!-- Candlesticks -->
  <line x1="24" y1="44" x2="24" y2="80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <rect x="19" y="52" width="10" height="20" rx="2" fill="#FFFFFF" />

  <line x1="50" y1="28" x2="50" y2="72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <rect x="45" y="36" width="10" height="24" rx="2" fill="#FFFFFF" />

  <line x1="76" y1="12" x2="76" y2="60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <rect x="71" y="20" width="10" height="28" rx="2" fill="#FFFFFF" />

  <!-- Upward Trend Line -->
  <path d="M 14 70 C 35 52, 55 40, 86 16" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Trend Arrow Head -->
  <path d="M 72 16 L 86 16 L 86 30" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
